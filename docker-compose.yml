# docker-compose.yml
#
# STAGE 2 of the pipeline: sets up Kafka locally.
#
# WHAT THIS FILE DOES (plain English):
# Defines one service - "kafka" - and tells Docker exactly how to run it:
# which version, which ports to expose to your machine, and some required
# settings for Kafka's newer "KRaft" mode (no separate Zookeeper needed).
#
# HOW TO USE:
#   docker compose up -d      <- starts Kafka in the background
#   docker compose ps         <- check it's running
#   docker compose logs -f    <- watch its logs live
#   docker compose down       <- stop and remove it

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: banking-kafka
    ports:
      - "9092:9092"          # the port your Python code will connect to
    environment:
      # --- KRaft mode settings (Kafka running without Zookeeper) ---
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "ZmZmZmZmZmZmZmZmZmZmZm"
    volumes:
      - kafka_data:/var/lib/kafka/data   # keeps Kafka's data if you restart the container

volumes:
  kafka_data: